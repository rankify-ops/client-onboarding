name: Deploy Client Site
on:
  workflow_dispatch:
    inputs:
      slug:
        required: true
      clientId:
        required: true
      company:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Create client repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Create the repo (ignore error if already exists)
          gh repo create rankify-ops/${{ inputs.slug }} --public 2>/dev/null || true

          # Clone it
          git clone https://x-access-token:${GH_TOKEN}@github.com/rankify-ops/${{ inputs.slug }}.git /tmp/${{ inputs.slug }}

          # Copy generated site files
          cp -r sites/${{ inputs.slug }}/* /tmp/${{ inputs.slug }}/

          # Configure git
          cd /tmp/${{ inputs.slug }}
          git config user.name "rankify-ops"
          git config user.email "rankify.aus@gmail.com"

          # Commit and push
          git add -A
          git commit -m "Auto-generated site for ${{ inputs.company }}" || echo "No changes"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push origin "$BRANCH"

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Get the default branch name
          DEFAULT_BRANCH=$(curl -s "https://api.github.com/repos/rankify-ops/${{ inputs.slug }}" \
            -H "Authorization: token ${GH_TOKEN}" | grep -o '"default_branch":"[^"]*"' | cut -d'"' -f4)
          # Enable Pages on the default branch
          curl -s -X POST "https://api.github.com/repos/rankify-ops/${{ inputs.slug }}/pages" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"build_type\":\"legacy\",\"source\":{\"branch\":\"${DEFAULT_BRANCH}\",\"path\":\"/\"}}" || true

      - name: Update CRM status
        run: |
          curl -s -X POST "https://rankify-crm.vercel.app/api/routine" \
            -H "Authorization: Bearer ${{ secrets.ROUTINE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"update_status\",\"clientId\":\"${{ inputs.clientId }}\",\"updates\":{\"status\":\"active\",\"website\":\"https://rankify-ops.github.io/${{ inputs.slug }}/\",\"notes\":\"Site auto-generated and deployed to GitHub Pages\"}}"

      - name: Send notification
        run: |
          curl -s -X POST "https://lert.dev/p/a508f12c-6bbc-422f-ad6c-1ff5abf7a5fa" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"[RANKIFY] New site built\",\"body\":\"${{ inputs.company }} — https://rankify-ops.github.io/${{ inputs.slug }}/\"}"

      - name: Cleanup pending and sites
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "rankify-ops"
          git config user.email "rankify.aus@gmail.com"
          rm -rf "sites/${{ inputs.slug }}"
          rm -f "pending/${{ inputs.clientId }}.json"
          git add -A
          git commit -m "Deployed: ${{ inputs.company }}" || echo "Nothing to clean"
          git push origin master
